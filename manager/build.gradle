import java.util.Properties
import javax.inject.Inject

plugins {
    id('com.android.application')
    id('org.jetbrains.kotlin.plugin.compose')
    id('com.google.devtools.ksp')
    id('dev.rikka.tools.refine')
}
android {
    namespace 'roro.stellar.manager'
    defaultConfig {
        applicationId "roro.stellar.manager"
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }

        resourceConfigurations += ['en', 'zh-rCN']
    }

    buildFeatures {
        buildConfig true
        prefab true
        compose true
    }

    def signingPropsFile = rootProject.file("signing.properties")
    def signingProps = new Properties()
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }
    def hasReleaseSigning = [
            "KEYSTORE_FILE",
            "KEYSTORE_PASSWORD",
            "KEYSTORE_ALIAS",
            "KEYSTORE_ALIAS_PASSWORD"
    ].every { signingProps.getProperty(it)?.trim() } &&
            rootProject.file(signingProps.getProperty("KEYSTORE_FILE", "")).exists()

    signingConfigs {
        sign {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingProps.getProperty("KEYSTORE_FILE"))
                storePassword signingProps.getProperty("KEYSTORE_PASSWORD")
                keyAlias signingProps.getProperty("KEYSTORE_ALIAS")
                keyPassword signingProps.getProperty("KEYSTORE_ALIAS_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.sign : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version = "3.22.1+"
        }
    }

    androidResources {
        generateLocaleConfig = true
    }

    packaging {
        resources {
            excludes += ['/META-INF/**']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

}

interface InjectedBuildOps {
    @Inject ExecOperations getExecOperations()
    @Inject FileSystemOperations getFileSystemOperations()
}

def buildOps = objects.newInstance(InjectedBuildOps)

abstract class CollapseReleaseResourceNames extends DefaultTask {
    @Inject abstract ExecOperations getExecOperations()
    @Inject abstract FileSystemOperations getFileSystemOperations()

    @Nested
    abstract Property<Aapt2> getAapt2Input()

    @InputFile
    abstract RegularFileProperty getConfigFile()

    @InputFile
    abstract RegularFileProperty getResourceZip()

    @TaskAction
    void collapse() {
        def zip = resourceZip.get().asFile
        if (!zip.exists()) {
            throw new GradleException("Optimized resources not found: ${zip}")
        }
        def aapt2 = aapt2Input.get().executable.get().asFile
        def optimized = new File(zip.parentFile, "${zip.name}.opt")
        execOperations.exec {
            commandLine aapt2.absolutePath, 'optimize',
                    '--collapse-resource-names',
                    '--resources-config-path', configFile.get().asFile.absolutePath,
                    '-o', optimized.absolutePath,
                    zip.absolutePath
        }
        fileSystemOperations.delete { delete zip }
        if (!optimized.renameTo(zip)) {
            throw new GradleException("Failed to replace optimized resources: ${zip}")
        }
    }
}

def collapseReleaseResourceNames = tasks.register('collapseReleaseResourceNames', CollapseReleaseResourceNames) {
    aapt2Input.set(androidComponents.sdkComponents.aapt2)
    configFile.set(layout.projectDirectory.file('aapt2-resources.cfg'))
    resourceZip.set(layout.buildDirectory.file(
            'intermediates/optimized_processed_res/release/optimizeReleaseResources/resources-release-optimize.ap_'
    ))
}

tasks.configureEach { task ->
    if (task.name == 'optimizeReleaseResources') {
        task.finalizedBy(collapseReleaseResourceNames)
    }
}

afterEvaluate {
    tasks.findByName('assembleRelease')?.doLast {
        def outDir = new File(rootDir, 'out')
        def mappingDir = new File(outDir, 'mapping')
        def apkDir = new File(outDir, 'apk')
        def mapping = layout.buildDirectory.file('outputs/mapping/release/mapping.txt').get().asFile
        if (mapping.exists()) {
            buildOps.fileSystemOperations.copy {
                from mapping
                into mappingDir
                rename { "mapping-${rootProject.ext.versionName}.txt" }
            }
        }
        def apk = fileTree(layout.buildDirectory.dir('outputs/apk/release').get().asFile) { include '*.apk' }
        if (!apk.isEmpty()) {
            buildOps.fileSystemOperations.copy {
                from apk
                into apkDir
                rename { "stellar-v${rootProject.ext.versionName}-release.apk" }
            }
        }
    }
}
tasks.withType(CompileArtProfileTask.class).configureEach {
    enabled = false
}

configurations.configureEach {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}
