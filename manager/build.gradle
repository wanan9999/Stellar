import com.android.build.gradle.internal.tasks.CompileArtProfileTask

import java.nio.file.Paths
import java.util.Properties

plugins {
    id('com.android.application')
    id('org.jetbrains.kotlin.plugin.compose')
    id('com.google.devtools.ksp')
    id('dev.rikka.tools.refine')
    id('dev.rikka.tools.autoresconfig')
}
android {
    namespace 'roro.stellar.manager'
    defaultConfig {
        applicationId "roro.stellar.manager"
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    buildFeatures {
        buildConfig true
        prefab true
        compose true
        aidl true
    }

    def signingPropsFile = rootProject.file("signing.properties")
    def signingProps = new Properties()
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }
    def hasReleaseSigning = [
            "KEYSTORE_FILE",
            "KEYSTORE_PASSWORD",
            "KEYSTORE_ALIAS",
            "KEYSTORE_ALIAS_PASSWORD"
    ].every { signingProps.getProperty(it)?.trim() } &&
            rootProject.file(signingProps.getProperty("KEYSTORE_FILE", "")).exists()

    signingConfigs {
        sign {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingProps.getProperty("KEYSTORE_FILE"))
                storePassword signingProps.getProperty("KEYSTORE_PASSWORD")
                keyAlias signingProps.getProperty("KEYSTORE_ALIAS")
                keyPassword signingProps.getProperty("KEYSTORE_ALIAS_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.sign : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version = "3.22.1+"
        }
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/**']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

}

autoResConfig {
    generatedClassFullName = "roro.stellar.manager.StellarLocales"
    generateRes = false
    generatedArrayFirstItem = "SYSTEM"
    generateLocaleConfig = true
}
def collapseReleaseResourceNames = task('collapseReleaseResourceNames').doLast {
    def aapt2 = Paths.get(project.android.sdkDirectory.path, 'build-tools', project.android.buildToolsVersion, 'aapt2')
    def zip = Paths.get(project.buildDir.path, 'intermediates',
            'optimized_processed_res', 'release', 'optimizeReleaseResources', 'resources-release-optimize.ap_')
    def optimized = new File("${zip}.opt")
    def cmd = exec {
        commandLine aapt2, 'optimize', '--collapse-resource-names',
                '--resources-config-path', 'aapt2-resources.cfg',
                '-o', optimized, zip
        ignoreExitValue false
    }
    if (cmd.exitValue == 0) {
        delete(zip)
        optimized.renameTo("$zip")
    }
}
afterEvaluate {
    tasks.findByName('optimizeReleaseResources')?.finalizedBy(collapseReleaseResourceNames)
    tasks.findByName('assembleRelease')?.doLast {
        def outDir = new File(rootDir, 'out')
        def mappingDir = new File(outDir, 'mapping')
        def apkDir = new File(outDir, 'apk')
        def mapping = file("${layout.buildDirectory.get()}/outputs/mapping/release/mapping.txt")
        if (mapping.exists()) {
            copy {
                from mapping
                into mappingDir
                rename { "mapping-${rootProject.ext.versionName}.txt" }
            }
        }
        def apk = fileTree("${layout.buildDirectory.get()}/outputs/apk/release").matching { include '*.apk' }
        if (!apk.isEmpty()) {
            copy {
                from apk
                into apkDir
                rename { "stellar-v${rootProject.ext.versionName}-release.apk" }
            }
        }
    }
}
tasks.withType(CompileArtProfileTask.class).configureEach {
    enabled = false
}

configurations.configureEach {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}
dependencies {
    implementation managerLibs.bundles.kotlinxCoroutines

    implementation project(':server')
    implementation project(':api')
    implementation project(':provider')
    implementation project(':userservice')

    implementation libs.hidden.compat
    compileOnly libs.hidden.stub

    implementation managerLibs.bundles.core
    implementation managerLibs.bundles.lifecycle

    implementation managerLibs.material

    def composeBom = platform(managerLibs.composeBom)
    implementation composeBom
    implementation managerLibs.bundles.composeUi
    debugImplementation managerLibs.composeUiTooling

    implementation managerLibs.libsuCore

    implementation managerLibs.bundles.nativeCrypto

    implementation managerLibs.appiconloader

    implementation managerLibs.capsule

    implementation managerLibs.roomRuntime
    implementation managerLibs.roomKtx
    ksp managerLibs.roomCompiler
    implementation managerLibs.gson
    implementation managerLibs.workRuntimeKtx
}
